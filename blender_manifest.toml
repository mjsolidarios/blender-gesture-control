schema_version = "1.0.0"

id = "hand_gesture_control"
version = "1.1.0"
name = "Hand Gesture Control"
tagline = "Control 3D objects with hand gestures through your webcam"
maintainer = "mjsolidarios"

type = "add-on"

tags = ["3D View", "Object", "Interface"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Download MediaPipe, OpenCV and the hand_landmarker.task model"
files = "Store the downloaded packages and model in your Blender user folder"
camera = "Capture webcam frames for hand tracking"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.zip",
]
